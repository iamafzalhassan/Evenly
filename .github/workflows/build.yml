name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: evenly-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Link shared framework for the simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Build iOS app for the simulator
        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
